name: Automatic Instagram news collection

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instagram-news-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Collect Instagram publications
        env:
          NEWS_CRON_SECRET: ${{ secrets.NEWS_CRON_SECRET }}
        run: |
          test -n "$NEWS_CRON_SECRET" || (echo "Configure o segredo NEWS_CRON_SECRET nas configurações do repositório." && exit 1)
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST \
            -H "x-news-cron-secret: $NEWS_CRON_SECRET" \
            "https://axtzvyybrmujrpuznbxd.supabase.co/functions/v1/instagram-news-sync"
