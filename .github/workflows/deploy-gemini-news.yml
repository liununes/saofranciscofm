name: Deploy Gemini news function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/gemini-news-draft/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-gemini-news.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: SUPABASE_ACCESS_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Gemini news function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref axtzvyybrmujrpuznbxd
          supabase functions deploy gemini-news-draft --project-ref axtzvyybrmujrpuznbxd --yes
