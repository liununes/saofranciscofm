name: Deploy Instagram connection test

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/instagram-connection-test/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-instagram-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: SUPABASE_ACCESS_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Deploy Instagram connection test
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref axtzvyybrmujrpuznbxd
          supabase functions deploy instagram-connection-test --project-ref axtzvyybrmujrpuznbxd --no-verify-jwt --yes

      - name: Test Instagram connection
        env:
          NEWS_CRON_SECRET: ${{ secrets.NEWS_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            "https://axtzvyybrmujrpuznbxd.supabase.co/functions/v1/instagram-connection-test" \
            -H "x-news-cron-secret: ${NEWS_CRON_SECRET}" \
            -H "Content-Type: application/json"
